[package]
name = "mrx-generate"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
exn = "0.3.0"
mrx-utils = { path = "../mrx-utils" }
thiserror = "2.0.17"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "ansi",
  "env-filter",
] }

[lints]
workspace = true
